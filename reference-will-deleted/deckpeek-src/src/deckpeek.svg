  </defs>
  <rect x="232" y="96" width="248" height="156" rx="20" fill="#002F5B"/>  <!-- 演示板 -->
  <rect x="268" y="140" width="148" height="24" rx="12" fill="#FFFFFF"/>
  <rect x="268" y="186" width="100" height="16" rx="8" fill="#4FA8FF"/>
  <circle cx="176" cy="312" r="132" fill="url(#ball)"/>
  <line x1="252" y1="412" x2="312" y2="244" stroke="#002F5B" stroke-width="28" stroke-linecap="round"/>
  <line x1="252" y1="412" x2="312" y2="244" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round"/>
