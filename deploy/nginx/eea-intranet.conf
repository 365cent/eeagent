# EEA same-origin intranet reverse proxy (Docker Compose service names).
# Terminate TLS on this server block when certificates are mounted at /etc/nginx/certs/.

client_max_body_size 120m;

upstream eea_api {
    server api:8000;
    keepalive 8;
}

upstream eea_web {
    server web:3000;
    keepalive 4;
}

server {
    listen 80;
    server_name _;

    # OPS-03 interim: no identity provider is wired yet, so nginx stamps a
    # configured pilot operator and the API still verifies the trusted peer.
    # Unset EEA_PILOT_OPERATOR/ROLE leaves the headers empty -> 401 (fail closed).
    proxy_set_header X-EEA-Authenticated-User "${EEA_PILOT_OPERATOR}";
    proxy_set_header X-EEA-Authenticated-Role "${EEA_PILOT_ROLE}";

    location /api/ {
        proxy_pass http://eea_api;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        # Header inheritance is dropped once a location sets any proxy_set_header,
        # so the identity stamped by nginx must be repeated here.
        proxy_set_header X-EEA-Authenticated-User "${EEA_PILOT_OPERATOR}";
        proxy_set_header X-EEA-Authenticated-Role "${EEA_PILOT_ROLE}";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Agent SSE / streaming
        proxy_set_header Connection "";
        chunked_transfer_encoding on;
    }

    location = /healthz {
        proxy_pass http://eea_api/healthz;
    }

    location = /readyz {
        proxy_pass http://eea_api/readyz;
    }

    location /docs {
        proxy_pass http://eea_api/docs;
    }

    location /openapi.json {
        proxy_pass http://eea_api/openapi.json;
    }

    # Capture-client releases: files placed in deploy/downloads (mounted read-only).
    # The client is published uncompressed now; old pages still ask for the zip
    # by name, so that URL hands over the current executable instead of a 404.
    location = /downloads/capture-v0.1.1-windows-amd64.zip {
        # Relative Location: nginx would otherwise drop the published port.
        absolute_redirect off;
        return 302 /api/v1/capture/client-download?platform=windows;
    }

    location /downloads/ {
        alias /usr/share/nginx/downloads/;
        autoindex off;
        default_type application/octet-stream;
        add_header X-Content-Type-Options nosniff;
    }

    location / {
        proxy_pass http://eea_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
