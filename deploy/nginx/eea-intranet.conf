# EEA same-origin intranet reverse proxy (Docker Compose service names).
# Terminate TLS on this server block when certificates are mounted at /etc/nginx/certs/.

client_max_body_size 120m;

upstream eea_api {
    server api:8000;
    keepalive 8;
}

upstream eea_web {
    server web:3000;
    keepalive 4;
}

server {
    listen 80;
    server_name _;

    # OPS-03: strip caller-supplied identity; only a trusted edge proxy may set these.
    proxy_set_header X-EEA-Authenticated-User "";
    proxy_set_header X-EEA-Authenticated-Role "";

    location /api/ {
        proxy_pass http://eea_api;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Agent SSE / streaming
        proxy_set_header Connection "";
        chunked_transfer_encoding on;
    }

    location = /healthz {
        proxy_pass http://eea_api/healthz;
    }

    location = /readyz {
        proxy_pass http://eea_api/readyz;
    }

    location /docs {
        proxy_pass http://eea_api/docs;
    }

    location /openapi.json {
        proxy_pass http://eea_api/openapi.json;
    }

    location / {
        proxy_pass http://eea_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
