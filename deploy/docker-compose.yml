# Linux intranet stack: PostgreSQL, API, capture worker, Next.js, Nginx.
# Copy deploy/.env.compose.example to deploy/.env and adjust before production.
name: eea

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-eea}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-eea}
      POSTGRES_DB: ${DB_NAME:-eea}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-eea} -d ${DB_NAME:-eea}"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      APP_ENV: ${APP_ENV:-production}
      OBJECT_DIR: /var/lib/eea/objects
    volumes:
      - objectstore:/var/lib/eea/objects
    depends_on:
      postgres:
        condition: service_healthy
    command: ["uv", "run", "alembic", "upgrade", "head"]
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      APP_ENV: ${APP_ENV:-production}
      CAPTURE_SERVER_FETCH_ENABLED: ${CAPTURE_SERVER_FETCH_ENABLED:-false}
      EEA_CAPTURE_EMBEDDED: "0"
      OBJECT_DIR: /var/lib/eea/objects
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      CORS_ORIGIN_REGEX: ${CORS_ORIGIN_REGEX:-}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
    volumes:
      - objectstore:/var/lib/eea/objects
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      APP_ENV: ${APP_ENV:-production}
      OBJECT_DIR: /var/lib/eea/objects
    volumes:
      - objectstore:/var/lib/eea/objects
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["uv", "run", "python", "-m", "app.worker"]

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        NEXT_PUBLIC_EEA_API_BASE: /api/v1
    restart: unless-stopped
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${EEA_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/eea-intranet.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  pgdata:
  objectstore:
