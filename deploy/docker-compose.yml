# EEA production stack for a Linux intranet host: PostgreSQL, migrations,
# API, capture worker, Next.js, Nginx. This is the only supported production
# path; the systemd units in this folder are legacy bare-metal templates.
#
# Everyday use (see deploy/README.md):
#   bash deploy/build.sh                  # build + start
#   bash deploy/build.sh 10.215.8.74      # same, behind an HTTP proxy
name: eea

x-backend: &backend
  build:
    context: ..
    dockerfile: deploy/Dockerfile.backend
    args:
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      no_proxy: ${no_proxy:-}
      PIP_INDEX_URL: ${PIP_INDEX_URL:-}
  image: eea-backend:${EEA_VERSION:-latest}
  env_file: .env
  environment: &backend-env
    APP_ENV: ${APP_ENV:-production}
    OBJECT_DIR: /var/lib/eea/objects
  volumes:
    - objectstore:/var/lib/eea/objects
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-eea}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in deploy/.env}
      POSTGRES_DB: ${DB_NAME:-eea}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-eea} -d ${DB_NAME:-eea}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    <<: *backend
    restart: "no"
    environment:
      <<: *backend-env
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    command: [".venv/bin/python", "-m", "alembic", "upgrade", "head"]

  api:
    <<: *backend
    environment:
      <<: *backend-env
      DB_HOST: postgres
      DB_PORT: 5432
      CAPTURE_SERVER_FETCH_ENABLED: "false"
      EEA_CAPTURE_EMBEDDED: "0"
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      CORS_ORIGIN_REGEX: ${CORS_ORIGIN_REGEX:-}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 40s

  worker:
    <<: *backend
    environment:
      <<: *backend-env
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: [".venv/bin/python", "-m", "app.worker"]

  maintenance:
    <<: *backend
    environment:
      <<: *backend-env
      DB_HOST: postgres
      DB_PORT: 5432
    profiles: ["ops"]
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: [".venv/bin/python", "-m", "app.services.orphan_maintenance", "--apply"]

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        NEXT_PUBLIC_EEA_API_BASE: /api/v1
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy: ${no_proxy:-}
    image: eea-web:${EEA_VERSION:-latest}
    restart: unless-stopped
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e 'fetch("http://127.0.0.1:3000/").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${EEA_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/eea-intranet.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  pgdata:
  objectstore:
