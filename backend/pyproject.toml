[project]
name = "eea-backend"
version = "0.1.0"
description = "EEA 前瞻技术扫描平台后端（FastAPI + PostgreSQL）"
authors = [
    { name = "Jianqi Ding", email = "dingjianqi@desaysv.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "beautifulsoup4>=4.12.3",
    "fastapi>=0.162.0",
    "html2text>=2024.2.26",
    "httpx>=0.28.1",
    "jieba>=0.42.1",
    "markitdown[all]>=0.1.9",
    "psycopg[binary]>=3.3.6",
    "pydantic-ai-slim[openai]>=2.63",
    "pydantic-settings>=2.16.1",
    "python-multipart>=0.0.20",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
