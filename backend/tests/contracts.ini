# Import Linter contracts for the backend package layout (BE-17).
# Canonical configuration lives in pyproject.toml [tool.importlinter].
# Run: uv run lint-imports

[importlinter]
root_package = app

[importlinter:contract:platform-isolation]
name = Platform must not import domains or API
type = forbidden
source_modules =
    app.platform
forbidden_modules =
    app.domains
    app.api

[importlinter:contract:domains-isolation]
name = Domains must not import API
type = forbidden
source_modules =
    app.domains
forbidden_modules =
    app.api

[importlinter:contract:services-isolation]
name = Services must not import API
type = forbidden
source_modules =
    app.services
forbidden_modules =
    app.api
